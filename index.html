<!DOCTYPE html>
<html lang="en" class="dark">
<head>

  <meta name="theme-color" content="#070b14" />
  <meta name="mobile-web-app-capable" content="yes" />

  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            void: '#070b14',
            panel: '#0e1626',
            panel2: '#141f35',
            line: '#22314e',
            cyan: '#22d3ee',
            amber: '#fbbf24',
            rose: '#f43f5e',
            emerald: '#34d399',
            violet: '#a78bfa'
          },
          fontFamily: {
            sans: ['Inter', 'system-ui', '-apple-system', 'Segoe UI', 'Roboto', 'sans-serif'],
            mono: ['ui-monospace', 'SFMono-Regular', 'Menlo', 'Monaco', 'Consolas', 'monospace']

        }
      }
    };

  <style>
    :root {
      --bg-void: #070b14;
      --bg-panel: #0e1626;
      --bg-panel-2: #141f35;
      --border-subtle: #22314e;
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      background-color: var(--bg-void);
      color: #f1f5f9;
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      overscroll-behavior-y: contain;
    }

    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    .thin-scroll::-webkit-scrollbar {
      width: 5px;
      height: 5px;
    }
    .thin-scroll::-webkit-scrollbar-track {
      background: rgba(15, 23, 42, 0.5);
    }
    .thin-scroll::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 999px;
    }

    .glass-header {
      background: rgba(7, 11, 20, 0.94);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
    }

    .bottom-nav-bar {
      padding-bottom: calc(8px + var(--safe-bottom));
      background: rgba(10, 16, 30, 0.97);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }

    .sheet-backdrop {
      animation: fadeIn 0.16s ease-out forwards;
    }
    .sheet-panel {
      animation: slideUp 0.22s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    @keyframes slideUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }

    mark.kw-hit {
      background: rgba(251, 191, 36, 0.24);
      color: #fde68a;
      border-radius: 3px;
      padding: 0 2px;
      font-weight: 600;
    }

    .card-hover {
      transition: transform 0.14s ease, border-color 0.14s ease, background-color 0.14s ease;
    }
    .card-hover:active {
      transform: scale(0.99);
    }
  </style>
</head>
<body class="min-h-screen flex flex-col bg-void text-slate-100 selection:bg-cyan/30 selection:text-cyan">

  <script>
    (function () {
      'use strict';

      let deferredInstallPrompt = null;
      (function setupDynamicPwa() {
        try {
          function createIconDataUrl(size) {
            const c = document.createElement('canvas');
            c.width = size;
            c.height = size;
            const ctx = c.getContext('2d');
            if (!ctx) return '';
            ctx.fillStyle = '#070b14';
            ctx.fillRect(0, 0, size, size);
            const grad = ctx.createLinearGradient(0, 0, size, size);
            grad.addColorStop(0, '#0e2942');
            grad.addColorStop(1, '#091829');
            ctx.fillStyle = grad;
            ctx.fillRect(size * 0.08, size * 0.08, size * 0.84, size * 0.84);
            ctx.strokeStyle = '#22d3ee';
            ctx.lineWidth = Math.max(2, size * 0.03);
            ctx.strokeRect(size * 0.08, size * 0.08, size * 0.84, size * 0.84);
            ctx.fillStyle = '#22d3ee';
            ctx.font = 'bold ' + Math.round(size * 0.34) + 'px system-ui, sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('SPH', size / 2, size * 0.52);
            return c.toDataURL('image/png');
          }

          const icon192 = createIconDataUrl(192);
          const icon512 = createIconDataUrl(512);
          if (icon192) {
            const appleIcon = document.createElement('link');
            appleIcon.rel = 'apple-touch-icon';
            appleIcon.href = icon192;
            document.head.appendChild(appleIcon);
          }

          const manifestObj = {
            name: 'Sentinel PH — Situational & Market Terminal',
            short_name: 'Sentinel PH',
            description: 'Philippine BPO, Ground Alert, FX, Crypto, AI, Mobility & Force Intelligence Terminal',
            start_url: location.href,
            display: 'standalone',
            background_color: '#070b14',
            theme_color: '#070b14',
            icons: [
              ...(icon192 ? [{ src: icon192, sizes: '192x192', type: 'image/png', purpose: 'any' }] : []),
              ...(icon512 ? [{ src: icon512, sizes: '512x512', type: 'image/png', purpose: 'any' }] : [])
            ]
          };

          const blob = new Blob([JSON.stringify(manifestObj)], { type: 'application/manifest+json' });
          const manifestUrl = URL.createObjectURL(blob);
          const linkEl = document.createElement('link');
          linkEl.rel = 'manifest';
          linkEl.href = manifestUrl;
          document.head.appendChild(linkEl);
        } catch (err) {
        }

          return {
            ...base,
            ...parsed,
            weatherData: { ...base.weatherData, ...(parsed.weatherData || {}) },
            fxData: { ...base.fxData, ...(parsed.fxData || {}) },
            cryptoData: {
              ...base.cryptoData,
              ...(parsed.cryptoData || {}),
              coins: { ...base.cryptoData.coins, ...((parsed.cryptoData && parsed.cryptoData.coins) || {}) }
            },
            briefings: Array.isArray(parsed.briefings) && parsed.briefings.length ? parsed.briefings : base.briefings,
            savedIds: Array.isArray(parsed.savedIds) ? parsed.savedIds : base.savedIds,
            watchlist: Array.isArray(parsed.watchlist) ? parsed.watchlist : base.watchlist,
            countries: Array.isArray(parsed.countries) ? parsed.countries : [],
            worldBank: { ...base.worldBank, ...(parsed.worldBank || {}) }
          };
        } catch (err) {
          return defaultState();
        }
      }

      function saveState() {
        try {
          const toStore = {
            ...state,
            briefings: state.briefings.slice(0, 140)
          };
          localStorage.setItem(STORAGE_KEY, JSON.stringify(toStore));
        } catch (err) {
        }
      }

      function sanitizeText(str) {
        if (typeof str !== 'string') return '';
        const div = document.createElement('div');
        div.innerHTML = str;
        return (div.textContent || div.innerText || '').replace(/\s+/g, ' ').trim();
      }

      function escapeHtml(str) {
        return String(str || '')
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      function sanitizeUrl(url) {
        if (!url || typeof url !== 'string') return '';
        const trimmed = url.trim();
        try {
          const parsed = new URL(trimmed);
          if (parsed.protocol === 'https:' || parsed.protocol === 'http:') {
            return parsed.href;
          }
          return '';
        } catch (err) {
          return '';
        }
      }

      function highlightMatches(text, extraTerms) {
        const safe = escapeHtml(text);
        const terms = [
          ...(state.watchlist || []),
          ...(state.searchQuery ? state.searchQuery.trim().split(/\s+/) : []),
          ...(extraTerms || [])
        ]
          .map(t => String(t || '').trim())
          .filter(t => t.length >= 2);

        if (!terms.length) return safe;
        const escapedTerms = terms.map(t => t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'));
        const regex = new RegExp('\\b(' + escapedTerms.join('|') + ')', 'gi');
        return safe.replace(regex, '<mark class="kw-hit">$1</mark>');
      }

      function timeAgo(isoStr) {
        if (!isoStr) return 'Recently';
        const ts = new Date(isoStr).getTime();
        if (Number.isNaN(ts)) return 'Recently';
        const diffSec = Math.max(0, Math.floor((Date.now() - ts) / 1000));
        if (diffSec < 60) return diffSec + 's ago';
        const diffMin = Math.floor(diffSec / 60);
        if (diffMin < 60) return diffMin + 'm ago';
        const diffHr = Math.floor(diffMin / 60);
        if (diffHr < 24) return diffHr + 'h ago';
        return Math.floor(diffHr / 24) + 'd ago';
      }

      function showToast(msg) {
        const el = document.getElementById('toast-banner');
        if (!el) return;
        el.textContent = msg;
        el.classList.remove('hidden');
        clearTimeout(showToast._timer);
        showToast._timer = setTimeout(() => el.classList.add('hidden'), 2400);
      }

      function classifyItem(rawTitle, rawDesc, feedDomain, feedSource, feedTier) {
        const title = sanitizeText(rawTitle);
        const desc = sanitizeText(rawDesc);
        const blob = (title + ' ' + desc).toLowerCase();

        let domain = feedDomain || 'ph_national';
        if (/\b(bitcoin|btc|ethereum|eth|solana|sol|crypto|blockchain|billionaire|net worth|musk|bezos|zuckerberg|huang|ramon ang|sy|razon)\b/.test(blob)) {
          domain = 'billionaires_crypto';
        } else if (/\b(artificial intelligence|llm|openai|anthropic|gemini|claude|agent|startup|darkhorse|robotics|semiconductor|nvidia)\b/.test(blob)) {
          domain = 'ai_darkhorses';
        } else if (/\b(electric vehicle|\bev\b|byd|tesla|motorcycle|e-moto|concept car|evtol|autonomous|charging)\b/.test(blob)) {
          domain = 'mobility';
        } else if (/\b(west philippine sea|\bwps\b|asean|afp|pentagon|missile|naval|submarines?|geopolitics|diplomacy|china.*philippines|philippines.*china)\b/.test(blob)) {
          domain = 'geopolitics';
        } else if (/\b(\bbpo\b|it-bpm|peza|bsp|inflation|interest rate|peso|remittance|psei|labor|dole|outsourcing)\b/.test(blob)) {
          domain = 'bpo_macro';
        } else if (/\b(clark|angeles|san fernando|pampanga|nlex|sctex|manila|flood|typhoon|pagasa|ndrrmc|strike|pnp|crime|scam|outage)\b/.test(blob)) {
          domain = 'ph_national';
        }

        const urgent12h = /\b(flood|typhoon|signal no\.?|pagasa|ndrrmc|strike|road closure|traffic|outage|blackout|earthquake|alert|advisory|urgent|crime|scam)\b/.test(blob);

        let subtag = 'National Pulse';
        if (/\b(clark|angeles|san fernando|pampanga|nlex|sctex|dau)\b/.test(blob)) subtag = 'Central Luzon';
        else if (/\b(manila|ncr|edsa|makati|bgc|quezon city)\b/.test(blob)) subtag = 'Metro Manila';
        else if (/\b(pnp|nbi|crime|scam|cybercrime|robbery|murder|arrest)\b/.test(blob)) subtag = 'Crime & Public';
        else if (/\b(\bbpo\b|it-bpm|peza|dole|labor)\b/.test(blob)) subtag = 'BPO & Labor';
        else if (/\b(bsp|peso|inflation|rate|psei|oil|fuel)\b/.test(blob)) subtag = 'Macro & FX';
        else if (/\b(billionaire|forbes|wealth|tycoon)\b/.test(blob)) subtag = 'Billionaires';
        else if (/\b(btc|bitcoin|eth|ethereum|crypto|token)\b/.test(blob)) subtag = 'Crypto';
        else if (/\b(ai|model|agent|startup|darkhorse)\b/.test(blob)) subtag = 'AI & Darkhorses';
        else if (/\b(ev|electric|motorcycle|moto|concept)\b/.test(blob)) subtag = 'EVs & Moto';
        else if (/\b(west philippine sea|wps|asean|defense|afp|military)\b/.test(blob)) subtag = 'WPS & Defense';

        let impactTag = 'Situation Update';
        let whyItMatters = 'Keeps your situational awareness current across Philippine and global developments.';

        if (domain === 'ph_national') {
          if (urgent12h) {
            impactTag = 'Commute & Ground Alert';
            whyItMatters = 'May affect travel times, local routes, utilities, or immediate personal safety in the Philippines.';
          } else {
            impactTag = 'PH National Pulse';
            whyItMatters = 'Highlights domestic policy, public safety, or social trends affecting everyday life in the PH.';
          }
        } else if (domain === 'bpo_macro') {
          impactTag = 'BPO & Macro Ripple';
          whyItMatters = 'Can influence BPO hiring/client demand, peso purchasing power, interest rates, or living costs.';
        } else if (domain === 'billionaires_crypto') {
          impactTag = 'Capital & Market Move';
          whyItMatters = 'Tracks high-impact wealth/corporate moves and crypto liquidity shifts driving risk sentiment.';
        } else if (domain === 'ai_darkhorses') {
          impactTag = 'AI & Builder Edge';
          whyItMatters = 'Useful for spotting new AI capabilities, workflow shifts, and emerging challenger startups.';
        } else if (domain === 'mobility') {
          impactTag = 'Mobility & Auto Trend';
          whyItMatters = 'Covers EV, motorcycle, and vehicle concept innovations relevant to future commuting and tech.';
        } else if (domain === 'geopolitics') {
          impactTag = 'ASEAN & Defense';
          whyItMatters = 'Monitors regional security, maritime tension, and diplomatic shifts impacting Southeast Asia.';
        } else if (domain === 'offshift') {
          impactTag = 'Off-Shift & Escape';
          whyItMatters = 'Idea for dining, road trips, or breaks outside shift hours.';
        }

        return {
          domain,
          subtag,
          impactTag,
          whyItMatters,
          urgent12h,
          tier: feedTier || 'National Media'
        };
      }

      async function fetchWeather() {
        const loc = WEATHER_LOCATIONS.find(w => w.id === state.weatherLocId) || WEATHER_LOCATIONS[0];
        try {
          const url = `https://api.open-meteo.com/v1/forecast?latitude=${loc.lat}&longitude=${loc.lon}&current=temperature_2m,precipitation_probability,weather_code,wind_speed_10m&hourly=temperature_2m,precipitation_probability&forecast_hours=12&timezone=Asia%2FManila`;
          const res = await fetch(url);
          if (!res.ok) throw new Error('Weather HTTP error');
          const data = await res.json();
          const cur = data.current || {};
          const hourly = data.hourly || {};
          const nextHours = (hourly.time || []).slice(0, 6).map((t, idx) => ({
            time: String(t).slice(11, 16),
            temp: Math.round((hourly.temperature_2m || [])[idx] ?? cur.temperature_2m ?? 30),
            pop: Math.round((hourly.precipitation_probability || [])[idx] ?? cur.precipitation_probability ?? 0)
          }));

          state.weatherData[loc.id] = {
            temp: Math.round(cur.temperature_2m ?? 31),
            pop: Math.round(cur.precipitation_probability ?? 20),
            wind: Math.round(cur.wind_speed_10m ?? 12),
            code: cur.weather_code ?? 0,
            hourly: nextHours,
            updatedAt: new Date().toISOString()
          };
          saveState();
        } catch (err) {
        }
      }

      async function fetchSingleFeed(feed) {
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 7000);
        try {
          const apiUrl = 'https://api.rss2json.com/v1/api.json?rss_url=' + encodeURIComponent(feed.url);
          const res = await fetch(apiUrl, { signal: controller.signal });
          if (!res.ok) throw new Error('Feed response not ok');
          const json = await res.json();
          if (json.status !== 'ok' || !Array.isArray(json.items)) throw new Error('Invalid feed payload');

          return json.items.slice(0, 6).map((item, idx) => {
            const title = sanitizeText(item.title || '');
            const cleanDesc = sanitizeText(item.description || item.content || '');
            const link = sanitizeUrl(item.link || feed.url);
            const pubDate = item.pubDate ? new Date(item.pubDate).toISOString() : new Date().toISOString();
            const meta = classifyItem(title, cleanDesc, feed.domain, feed.source, feed.tier);
            const idBase = (feed.source + '-' + title + '-' + idx).replace(/[^a-zA-Z0-9_-]/g, '').slice(0, 48);

            return {
              id: idBase || ('item-' + Date.now() + '-' + idx),
              title,
              summary: cleanDesc.slice(0, 210) || meta.whyItMatters,
              details: cleanDesc || title,
              domain: meta.domain,
              subtag: meta.subtag,
              impactTag: meta.impactTag,
              source: feed.source,
              tier: meta.tier,
              link,
              publishedAt: pubDate,
              urgent12h: meta.urgent12h,
              whyItMatters: meta.whyItMatters
            };
          }).filter(it => it.title.length > 6);
        } catch (err) {
          return [];
        } finally {
          clearTimeout(timeoutId);
        }
      }

      async function fetchRssFeeds() {
        const results = await Promise.allSettled(RSS_FEEDS.map(f => fetchSingleFeed(f)));
        const freshItems = [];
        for (const r of results) {
          if (r.status === 'fulfilled' && Array.isArray(r.value)) {
            freshItems.push(...r.value);
          }
        }

        if (freshItems.length > 0) {
          const seen = new Set();
          const merged = [...freshItems, ...state.briefings].filter(item => {
            const key = (item.title || '').toLowerCase().slice(0, 75);
            if (!key || seen.has(key)) return false;
            seen.add(key);
            return true;
          });

          merged.sort((a, b) => {
            const aUrgent = a.urgent12h ? 1 : 0;
            const bUrgent = b.urgent12h ? 1 : 0;
            if (aUrgent !== bUrgent) return bUrgent - aUrgent;
            return new Date(b.publishedAt || 0).getTime() - new Date(a.publishedAt || 0).getTime();
          });

          state.briefings = merged.slice(0, 140);
          saveState();
        }
      }

      async function fetchAllNationsMilitaryData() {
        if (state.countries.length >= 180 && Object.keys(state.worldBank.budgetUsd || {}).length > 50) {
          return;
        }
        try {
          const [countriesRes, budgetRes, gdpRes, persRes] = await Promise.all([
            fetch('https://restcountries.com/v3.1/all?fields=name,cca3,cca2,population,area,region,subregion'),
            fetch('https://api.worldbank.org/v2/country/all/indicator/MS.MIL.XPND.CD?format=json&per_page=300&MRV=1'),
            fetch('https://api.worldbank.org/v2/country/all/indicator/MS.MIL.XPND.GD.ZS?format=json&per_page=300&MRV=1'),
            fetch('https://api.worldbank.org/v2/country/all/indicator/MS.MIL.TOTL.P1?format=json&per_page=300&MRV=1')
          ]);

          if (countriesRes.ok) {
            const cJson = await countriesRes.json();
            if (Array.isArray(cJson)) {
              state.countries = cJson
                .filter(c => c.cca3 && c.name && c.name.common)
                .map(c => ({
                  cca3: c.cca3,
                  cca2: c.cca2 || '',
                  name: c.name.common,
                  population: Number(c.population) || 0,
                  area: Number(c.area) || 0,
                  region: c.region || 'Other',
                  subregion: c.subregion || '',
                  flagEmoji: (c.cca2 && c.cca2.length === 2)
                    ? String.fromCodePoint(...c.cca2.toUpperCase().split('').map(ch => 127397 + ch.charCodeAt(0)))
                    : '🏳️'
                }))
                .sort((a, b) => {
                  if (a.cca3 === 'PHL') return -1;
                  if (b.cca3 === 'PHL') return 1;
                  return b.population - a.population;
                });
            }
          }

          const parseWb = (resJson) => {
            const map = {};
            if (Array.isArray(resJson) && Array.isArray(resJson[1])) {
              for (const row of resJson[1]) {
                const code = row.countryiso3code || (row.country && row.country.id);
                if (code && row.value !== null && row.value !== undefined) {
                  map[code] = { value: Number(row.value), year: row.date || '' };
                }
              }
            }
            return map;
          };

          if (budgetRes.ok) state.worldBank.budgetUsd = parseWb(await budgetRes.json());
          if (gdpRes.ok) state.worldBank.gdpPct = parseWb(await gdpRes.json());
          if (persRes.ok) state.worldBank.personnel = parseWb(await persRes.json());

          saveState();
        } catch (err) {
        }
      }

      function getEnrichedNations() {
        const fallbackList = Object.entries(DEFENSE_PROFILES).map(([cca3, p]) => ({
          cca3,
          cca2: p.iso2,
          name: p.name,
          population: p.population || 0,
          area: p.area || 0,
          region: p.region,
          subregion: p.subregion,
          flagEmoji: p.flag
        }));

        const baseList = state.countries.length ? state.countries : fallbackList;

        return baseList.map(c => {
          const profile = DEFENSE_PROFILES[c.cca3] || {};
          const budgetObj = state.worldBank.budgetUsd[c.cca3];
          const gdpObj = state.worldBank.gdpPct[c.cca3];
          const persObj = state.worldBank.personnel[c.cca3];
          const popVal = Number(c.population || profile.population || 0);
          const areaVal = Number(c.area || profile.area || 0);
          const budgetVal = budgetObj ? budgetObj.value : (profile.budgetUsd ?? null);
          const gdpVal = gdpObj ? Number(gdpObj.value).toFixed(2) : (profile.gdpPct || null);
          const estManpower = popVal ? Math.round(popVal * 0.42) : 0;

          return {
            cca3: c.cca3,
            cca2: c.cca2 || profile.iso2 || '',
            name: c.name || profile.name,
            population: popVal,
            area: areaVal,
            flag: profile.flag || c.flagEmoji || '🏳️',
            regionGroup: profile.region || (c.subregion && c.subregion.includes('South-Eastern Asia') ? 'ASEAN' : c.region),
            subregion: profile.subregion || c.subregion || c.region,
            highlightPH: c.cca3 === 'PHL',
            activeTroops: profile.activeTroops || (persObj ? Number(persObj.value).toLocaleString() : 'Data via WB/SIPRI'),
            reserveTroops: profile.reserveTroops || '—',
            availManpower: estManpower ? estManpower.toLocaleString() : '—',
            budgetUsd: budgetVal,
            gdpPct: gdpVal,
            landAssets: profile.landAssets || 'Standard ground & territorial security forces (detailed asset ledger varies by nation)',
            airAssets: profile.airAssets || 'Transport, utility & surveillance aviation / air defense',
            navalAssets: profile.navalAssets || (areaVal > 0 ? 'Coast guard, patrol & maritime security assets' : 'Maritime/territorial patrol'),
            resources: profile.resources || ((c.subregion || c.region || 'Regional') + ' resources & trade corridors'),
            modernizationNote: profile.modernizationNote || 'National defense & security posture tracked via public demographic and World Bank indicators.'
          };
        });
      }

      function formatCompactUsd(num) {
        if (num === null || num === undefined || Number.isNaN(Number(num))) return 'N/A';
        const n = Number(num);
        if (n >= 1e12) return '$' + (n / 1e12).toFixed(2) + 'T';
        if (n >= 1e9) return '$' + (n / 1e9).toFixed(1) + 'B';
        if (n >= 1e6) return '$' + (n / 1e6).toFixed(1) + 'M';
        return '$' + n.toLocaleString();
      }

      function formatCompactPop(num) {
        if (!num) return '—';
        if (num >= 1e9) return (num / 1e9).toFixed(2) + 'B';
        if (num >= 1e6) return (num / 1e6).toFixed(1) + 'M';
        if (num >= 1e3) return (num / 1e3).toFixed(0) + 'K';
        return String(num);
      }

      async function syncAll(showFeedback) {
        if (isSyncing) return;
        isSyncing = true;
        const icon = document.getElementById('sync-icon');
        if (icon) icon.classList.add('animate-spin');

        try {
          await Promise.allSettled([
            fetchWeather(),
            fetchFxRates(),
            fetchCryptoRates(),
            fetchRssFeeds(),
            fetchAllNationsMilitaryData()
          ]);
          state.lastSync = new Date().toISOString();
          saveState();
          renderAll();
          if (showFeedback) showToast('Sentinel PH synced live telemetry & feeds');
        } finally {
          isSyncing = false;
          if (icon) icon.classList.remove('animate-spin');
        }
      }

      function computeAlertLevel() {
        const loc = state.weatherLocId || 'angeles';
        const wx = state.weatherData[loc];
        const highRain = wx && (wx.pop >= 70 || wx.temp >= 37);
        const urgentCount = state.briefings.filter(b => b.urgent12h).length;
        const watchlistHits = state.briefings.filter(b => {
          const text = ((b.title || '') + ' ' + (b.summary || '')).toLowerCase();
          return (state.watchlist || []).some(kw => kw && text.includes(kw.toLowerCase()));
        }).length;

        if (highRain || urgentCount >= 4 || watchlistHits >= 5) {
          return { label: 'ELEVATED', cls: 'bg-amber/20 text-amber border-amber/50' };
        }
        return { label: 'LOW ALERT', cls: 'bg-emerald/15 text-emerald border-emerald/40' };
      }

        const drawer = document.getElementById('telemetry-drawer');
        if (!telemetryDrawerOpen) {
          drawer.classList.add('hidden');

          return;
        }
        drawer.classList.remove('hidden');

        if (telemetryDrawerOpen === 'weather') {
          const loc = WEATHER_LOCATIONS.find(w => w.id === state.weatherLocId) || WEATHER_LOCATIONS[0];
          const wx = state.weatherData[loc.id] || { temp: 31, pop: 30, wind: 12, hourly: [] };
          const locButtons = WEATHER_LOCATIONS.map(w => {
            const active = w.id === loc.id;
            return '<button type="button" data-action="select-weather-loc" data-loc="' + w.id + '"' +
              ' class="px-2 py-1 rounded-md text-[11px] font-medium border cursor-pointer ' +
              (active ? 'bg-cyan/20 text-cyan border-cyan/50' : 'bg-panel text-slate-300 border-line') + '">' +
              escapeHtml(w.label) + '</button>';
          }).join('');

          const hourlyHtml = (wx.hourly || []).length
            ? '<div class="grid grid-cols-6 gap-1 mt-2 pt-2 border-t border-line/70 text-center font-mono">' +

                    '<div class="text-[10px] text-cyan">' + h.pop + '%</div>' +

              '<span class="font-semibold text-white">🌤️ Shift Weather & Rain Radar — ' + escapeHtml(loc.label) + '</span>' +

            '</div>' +
            '<div class="flex flex-wrap gap-1.5">' + locButtons + '</div>' +
            hourlyHtml;
        } else if (telemetryDrawerOpen === 'fx') {
          const prev = state.fxData.prevPhpRates || {};
          const pairs = [
            { code: 'USD', label: 'US Dollar', val: prev.USD ?? state.fxData.rates.PHP },
            { code: 'AUD', label: 'Australian $', val: prev.AUD ?? 41.8 },
            { code: 'GBP', label: 'British £', val: prev.GBP ?? 50.4 },

          drawer.innerHTML =
            '<div class="flex items-center justify-between mb-2">' +
              '<span class="font-semibold text-white">💱 Philippine Peso (PHP) Multi-Currency</span>' +
              '<span class="text-[10px] font-mono text-slate-400">' + (state.fxData.updatedAt ? ('Updated ' + timeAgo(state.fxData.updatedAt)) : 'Reference rates') + '</span>' +
            '</div>' +
            '<div class="grid grid-cols-2 sm:grid-cols-3 gap-1.5 font-mono">' +
              pairs.map(p => {
                const formatted = p.code === 'JPY' ? ('₱' + Number(p.val).toFixed(3)) : ('₱' + Number(p.val).toFixed(2));
                return '<div class="rounded-lg bg-panel p-2 border border-line/80 flex items-center justify-between">' +
                  '<div>' +
                    '<div class="text-xs font-bold text-emerald">' + p.code + '/PHP</div>' +
                    '<div class="text-[10px] text-slate-400 font-sans">' + p.label + '</div>' +

          const coins = Object.values(state.cryptoData.coins || {});
          drawer.innerHTML =
            '<div class="flex items-center justify-between mb-2">' +

              coins.map(c => {

                '</div>';
              }).join('') +
            '</div>';

      function filterBriefings(list) {
        const q = state.searchQuery.trim().toLowerCase();
        return list.filter(item => {
          if (state.activeNav === 'radar') {
            if (state.activeDomain !== 'all' && item.domain !== state.activeDomain) return false;
          }
          if (state.sourceTierFilter !== 'all' && item.tier !== state.sourceTierFilter) return false;
          if (state.preShiftOnly && !item.urgent12h) return false;

          if (q) {
            const hay = ((item.title || '') + ' ' + (item.summary || '') + ' ' + (item.details || '') + ' ' + (item.source || '') + ' ' + (item.impactTag || '') + ' ' + (item.subtag || '')).toLowerCase();
            if (!hay.includes(q)) return false;
          }
          return true;
        });
      }

                  '<span class="text-amber">' + escapeHtml(partner.flag) + ' ' + formatCompactPop(partner.population) + '</span>' +
                '</div>' +
                '<div class="h-2 rounded-full bg-void overflow-hidden flex">' +
                  '<div class="bg-cyan h-full" style="width:' + Math.max(4, Math.round((phPop / maxPop) * 100)) + '%"></div>' +
                '</div>' +
                '<div class="h-2 rounded-full bg-void overflow-hidden flex mt-1">' +
                  '<div class="bg-amber h-full" style="width:' + Math.max(4, Math.round((partnerPop / maxPop) * 100)) + '%"></div>' +
                '</div>' +
              '</div>' +

              '<div>' +
                '<div class="flex justify-between text-[11px] mb-1">' +
                  '<span class="text-cyan">🇵🇭 ' + formatCompactUsd(ph.budgetUsd) + '</span>' +
                  '<span class="text-slate-400 font-sans">Defense Budget (WB)</span>' +
                  '<span class="text-amber">' + escapeHtml(partner.flag) + ' ' + formatCompactUsd(partner.budgetUsd) + '</span>' +
                '</div>' +
                '<div class="h-2 rounded-full bg-void overflow-hidden flex">' +
                  '<div class="bg-cyan h-full" style="width:' + (phBudget ? Math.max(4, Math.round((phBudget / maxBudget) * 100)) : 4) + '%"></div>' +
                '</div>' +
                '<div class="h-2 rounded-full bg-void overflow-hidden flex mt-1">' +
                  '<div class="bg-amber h-full" style="width:' + (partnerBudget ? Math.max(4, Math.round((partnerBudget / maxBudget) * 100)) : 4) + '%"></div>' +
                '</div>' +
              '</div>' +
            '</div>' +

            '<div class="rounded-lg bg-void/70 p-2.5 border border-line/70 text-[11px] space-y-1">' +
              '<div class="font-bold text-amber">' + escapeHtml(partner.flag) + ' ' + escapeHtml(partner.name) + ' Overview</div>' +
              '<div><span class="text-slate-400">Active / Reserve:</span> <span class="text-slate-200 font-mono">' + escapeHtml(partner.activeTroops) + ' / ' + escapeHtml(partner.reserveTroops) + '</span></div>' +
              '<div><span class="text-slate-400">Land / Air / Navy:</span> <span class="text-slate-200">' + escapeHtml(partner.landAssets) + ' • ' + escapeHtml(partner.airAssets) + ' • ' + escapeHtml(partner.navalAssets) + '</span></div>' +
              '<div><span class="text-slate-400">Resources:</span> <span class="text-slate-200">' + escapeHtml(partner.resources) + '</span></div>' +
            '</div>' +
          '</section>' +

          '<section class="space-y-2">' +
            '<div class="flex items-center justify-between">' +
              '<h3 class="text-xs font-bold text-white">🌍 All Nations Directory (' + nations.length + ' available)</h3>' +
              '<span class="text-[10px] font-mono text-slate-400">Showing ' + filteredNations.length + '</span>' +
            '</div>' +

            '<input id="mil-search-input" data-action="mil-search" type="search" value="' + escapeHtml(militarySearchQuery) + '"' +
              ' placeholder="Filter any country, region, or resource (e.g. Japan, Vietnam, nickel, oil)..."' +
              ' class="w-full px-3 py-1.5 rounded-lg bg-panel border border-line text-xs text-slate-100 placeholder-slate-500 focus:outline-none focus:border-cyan" />' +

            '<div class="flex items-center gap-1.5 overflow-x-auto no-scrollbar pb-0.5">' +
              regions.map(r => {
                const active = militaryRegionFilter === r;
                return '<button type="button" data-action="select-mil-region" data-region="' + r + '"' +
                  ' class="px-2.5 py-1 rounded-full text-[11px] font-semibold whitespace-nowrap border cursor-pointer ' +
                  (active ? 'bg-cyan text-void border-cyan' : 'bg-panel text-slate-300 border-line') + '">' +
                  (r === 'ALL' ? 'All Regions' : r) + '</button>';
              }).join('') +
            '</div>' +

            '<div class="space-y-2">' +
              filteredNations.map(n =>
                '<div class="rounded-xl bg-panel border ' + (n.highlightPH ? 'border-cyan/60 bg-cyan/5' : 'border-line') + ' p-3 space-y-1.5">' +
                  '<div class="flex items-center justify-between gap-2">' +
                    '<div class="flex items-center gap-2 min-w-0">' +
                      '<span class="text-lg">' + escapeHtml(n.flag) + '</span>' +
                      '<div class="min-w-0">' +
                        '<div class="text-xs font-bold text-white truncate">' + escapeHtml(n.name) + ' <span class="text-[10px] font-mono text-slate-400">(' + escapeHtml(n.cca3) + ')</span></div>' +
                        '<div class="text-[10px] text-slate-400 truncate">' + escapeHtml(n.subregion || n.region) + '</div>' +
                      '</div>' +
                    '</div>' +
                    '<div class="text-right font-mono text-xs shrink-0">' +
                      '<div class="font-bold text-amber">' + formatCompactUsd(n.budgetUsd) + '</div>' +
                      '<div class="text-[10px] text-slate-400">Pop: ' + formatCompactPop(n.population) + '</div>' +
                    '</div>' +
                  '</div>' +
                  '<div class="text-[11px] text-slate-300 leading-snug">' +
                    '<span class="text-slate-400">Personnel:</span> <span class="font-mono text-cyan">' + escapeHtml(n.activeTroops) + '</span>' +
                    (n.gdpPct ? (' <span class="text-slate-400">•</span> <span class="font-mono text-emerald">' + escapeHtml(n.gdpPct) + '% GDP</span>') : '') +
                  '</div>' +
                  '<div class="text-[11px] text-slate-300">' +
                    '<span class="text-slate-400">Forces & Resources:</span> ' + escapeHtml(n.navalAssets) + ' — ' + escapeHtml(n.resources) +
                  '</div>' +
                '</div>'
              ).join('') +
            '</div>' +
          '</section>';
      }

      function renderSavedView(container) {
        const savedBriefings = state.briefings.filter(b => state.savedIds.includes(b.id));
        container.innerHTML =
          '<div class="flex items-center justify-between">' +
            '<div>' +
              '<h2 class="text-sm font-bold text-white">🔖 Saved Briefings Vault</h2>' +
              '<p class="text-[11px] text-slate-400">Stored locally in your browser for offline reading</p>' +
            '</div>' +
            (savedBriefings.length ? '<button type="button" data-action="clear-saved" class="px-2.5 py-1 rounded-lg border border-rose/40 text-rose text-[11px] font-semibold hover:bg-rose/10 cursor-pointer">Clear All</button>' : '') +
          '</div>' +
          '<div class="space-y-2.5">' +
            (savedBriefings.length
              ? savedBriefings.map(renderBriefingCard).join('')
              : ('<div class="rounded-xl bg-panel border border-line p-6 text-center space-y-1.5">' +
                  '<div class="text-2xl">📑</div>' +
                  '<div class="text-sm font-semibold text-white">No saved briefings yet</div>' +
                  '<p class="text-xs text-slate-400">Tap the bookmark icon on any card in Radar to keep it here.</p>' +
                 '</div>')) +
          '</div>';
      }

      function renderMainView() {
        const container = document.getElementById('main-content');
        document.querySelectorAll('.nav-item').forEach(btn => {
          const isAct = btn.dataset.nav === state.activeNav;
          btn.className = 'nav-item flex flex-col items-center justify-center py-1 rounded-lg transition relative cursor-pointer ' +
            (isAct ? 'text-cyan bg-cyan/10' : 'text-slate-400 hover:text-slate-200');
        });

        if (state.activeNav === 'offshift') {
          renderOffshiftView(container);
        } else if (state.activeNav === 'military') {
          renderMilitaryView(container);
        } else if (state.activeNav === 'saved') {
          renderSavedView(container);
        } else {
          renderRadarView(container);
        }
      }

      function renderAll() {
        renderHeaderTelemetry();
        renderMainView();
      }

      function openDeepDive(id) {
        const item = state.briefings.find(b => b.id === id);
        if (!item) return;

        const modal = document.getElementById('deep-dive-modal');
        const body = document.getElementById('dd-body');
        document.getElementById('dd-domain-pill').textContent = item.impactTag || 'Briefing';
        document.getElementById('dd-source-tier').textContent = (item.source || '') + ' • ' + (item.tier || '') + ' • ' + timeAgo(item.publishedAt);

        const safeUrl = sanitizeUrl(item.link);
        const isSaved = state.savedIds.includes(item.id);

        body.innerHTML =
          '<h2 class="text-base font-bold text-white leading-snug">' + escapeHtml(item.title) + '</h2>' +
          '<div class="rounded-xl bg-void/80 border border-cyan/30 p-3 space-y-1">' +
            '<div class="text-[11px] font-mono uppercase tracking-wider text-cyan font-bold">Why This Matters</div>' +
            '<p class="text-xs text-slate-200">' + escapeHtml(item.whyItMatters) + '</p>' +
          '</div>' +
          '<div class="space-y-2 text-xs text-slate-300 leading-relaxed">' +
            '<p>' + escapeHtml(item.details || item.summary) + '</p>' +
          '</div>' +
          (safeUrl
            ? ('<div class="rounded-xl bg-panel2 border border-line p-3 space-y-2">' +
                '<div class="text-[11px] font-semibold text-slate-300">Direct Publisher Source Link</div>' +
                '<div class="flex items-center gap-2">' +
                  '<input type="text" readonly value="' + escapeHtml(safeUrl) + '"' +
                    ' class="flex-1 min-w-0 px-2.5 py-1.5 rounded-lg bg-void border border-line text-[11px] font-mono text-cyan select-all focus:outline-none" />' +
                  '<button type="button" data-action="copy-url" data-url="' + escapeHtml(safeUrl) + '"' +
                    ' class="px-2.5 py-1.5 rounded-lg bg-slate-800 border border-line text-xs font-semibold text-white hover:border-cyan shrink-0 cursor-pointer">' +
                    'Copy URL' +
                  '</button>' +
                '</div>' +
                '<div class="flex flex-wrap items-center justify-between gap-2 pt-1">' +
                  '<button type="button" data-action="toggle-save" data-id="' + escapeHtml(item.id) + '"' +
                    ' class="px-3 py-1.5 rounded-lg border border-line bg-panel text-xs font-semibold text-slate-200 hover:border-cyan cursor-pointer">' +
                    (isSaved ? '🔖 Saved in Vault' : '📑 Save Briefing') +
                  '</button>' +
                  '<a href="' + escapeHtml(safeUrl) + '" target="_blank" rel="noopener noreferrer"' +
                    ' class="px-3.5 py-1.5 rounded-lg bg-cyan text-void text-xs font-bold hover:opacity-95 inline-flex items-center gap-1">' +
                    '<span>Open Original Article</span>' +
                    '<span>↗</span>' +
                  '</a>' +
                '</div>' +
              '</div>')
            : '<div class="rounded-xl bg-panel2 border border-line p-3 text-xs text-slate-400">Curated internal briefing — no external publisher link attached.</div>');

        modal.classList.remove('hidden');
      }

      function openWatchlistModal() {
        const modal = document.getElementById('watchlist-modal');
        const body = document.getElementById('watchlist-body');

        const presetHtml = PRESET_PACKS.map(p =>
          '<button type="button" data-action="apply-preset" data-preset="' + escapeHtml(p.id) + '"' +
            ' class="px-2.5 py-1.5 rounded-lg bg-panel2 border border-line hover:border-cyan text-left text-xs font-medium text-slate-200 transition cursor-pointer">' +
            escapeHtml(p.label) + '</button>'
        ).join('');

        const chipsHtml = (state.watchlist || []).map(kw =>
          '<span class="inline-flex items-center gap-1 px-2.5 py-1 rounded-full bg-amber/15 border border-amber/40 text-amber text-xs font-medium">' +
            '<span>' + escapeHtml(kw) + '</span>' +
            '<button type="button" data-action="remove-keyword" data-kw="' + escapeHtml(kw) + '" class="text-amber hover:text-white font-bold cursor-pointer">×</button>' +
          '</span>'
        ).join('');

        body.innerHTML =
          '<div class="space-y-2">' +
            '<div class="text-xs font-bold text-cyan">One-Tap Daily Edge Presets</div>' +
            '<div class="grid grid-cols-1 sm:grid-cols-2 gap-1.5">' + presetHtml + '</div>' +
          '</div>' +
          '<div class="space-y-2">' +
            '<div class="text-xs font-bold text-white">Add Custom Keyword</div>' +
            '<div class="flex gap-2">' +
              '<input id="new-kw-input" type="text" placeholder="e.g. TaskUs, Converge, BYD, Subic..."' +
                ' class="flex-1 px-3 py-1.5 rounded-lg bg-void border border-line text-xs text-white focus:outline-none focus:border-cyan" />' +
              '<button type="button" data-action="add-keyword" class="px-3 py-1.5 rounded-lg bg-cyan text-void text-xs font-bold hover:opacity-95 cursor-pointer">Add</button>' +
            '</div>' +
          '</div>' +
          '<div class="space-y-2">' +
            '<div class="text-xs font-bold text-slate-300">Active Watchlist (' + (state.watchlist || []).length + ')</div>' +
            '<div class="flex flex-wrap gap-1.5">' + (chipsHtml || '<span class="text-xs text-slate-500">No custom keywords set.</span>') + '</div>' +
          '</div>';

        modal.classList.remove('hidden');
      }

      function openInstallModal() {
        const modal = document.getElementById('install-modal');
        const body = document.getElementById('install-body');
        const isLocalFile = location.protocol === 'file:';

        body.innerHTML =
          (deferredInstallPrompt
            ? ('<div class="rounded-xl bg-cyan/15 border border-cyan/40 p-3 space-y-2">' +
                '<div class="font-bold text-cyan text-sm">Ready for One-Tap Chrome Install</div>' +
                '<p class="text-slate-200">Your browser supports direct app installation. Tap below to add Sentinel PH to your home screen or desktop apps.</p>' +
                '<button type="button" data-action="trigger-native-install" class="w-full py-2 rounded-lg bg-cyan text-void font-bold text-xs cursor-pointer">Install Sentinel PH Now</button>' +
               '</div>')
            : '') +
          (isLocalFile
            ? ('<div class="rounded-xl bg-amber/15 border border-amber/40 p-3 space-y-1">' +
                '<div class="font-bold text-amber">Opened as Local File (file://)</div>' +
                '<p class="text-slate-200">You can bookmark this tab right now in Chrome, or host this HTML file on free HTTPS hosting (such as Cloudflare Pages or GitHub Pages) to unlock full "Add to Home Screen / Install App" standalone mode.</p>' +
               '</div>')
            : '') +
          '<div class="rounded-xl bg-void/80 border border-line p-3 space-y-1.5">' +
            '<div class="font-bold text-white">📱 Android (Google Chrome / Edge)</div>' +
            '<ol class="list-decimal pl-4 space-y-1 text-slate-300">' +
              '<li>Open Sentinel PH in <strong>Google Chrome</strong>.</li>' +
              '<li>Tap the <strong>⋮ (three dots)</strong> menu in the top-right corner.</li>' +
              '<li>Tap <strong>Add to Home screen</strong> or <strong>Install app</strong>, then confirm.</li>' +
            '</ol>' +
          '</div>' +
          '<div class="rounded-xl bg-void/80 border border-line p-3 space-y-1.5">' +
            '<div class="font-bold text-white">💻 Desktop (Chrome / Edge)</div>' +
            '<ol class="list-decimal pl-4 space-y-1 text-slate-300">' +
              '<li>Click the <strong>Install icon</strong> in the right side of the address bar, or open <strong>⋮ → Cast, save, and share → Install page as app</strong>.</li>' +
            '</ol>' +
          '</div>' +
          '<div class="rounded-xl bg-void/80 border border-line p-3 space-y-1.5">' +
            '<div class="font-bold text-white">🍎 iPhone / iPad (Safari)</div>' +
            '<ol class="list-decimal pl-4 space-y-1 text-slate-300">' +
              '<li>Tap the <strong>Share</strong> button at the bottom of Safari.</li>' +
              '<li>Scroll down and tap <strong>Add to Home Screen</strong>.</li>' +
            '</ol>' +
          '</div>';

        modal.classList.remove('hidden');
      }

      document.addEventListener('click', function (e) {
        const target = e.target.closest('[data-action]');
        if (!target) {
          if (e.target.id === 'deep-dive-modal') {
            document.getElementById('deep-dive-modal').classList.add('hidden');
          } else if (e.target.id === 'watchlist-modal') {
            document.getElementById('watchlist-modal').classList.add('hidden');
          } else if (e.target.id === 'install-modal') {
            document.getElementById('install-modal').classList.add('hidden');
          }
          return;
        }

        const action = target.dataset.action;

        if (action === 'install-app') {
          if (deferredInstallPrompt) {
            deferredInstallPrompt.prompt();
            deferredInstallPrompt.userChoice.finally(() => {
              deferredInstallPrompt = null;
            });
          } else {
            openInstallModal();
          }
        } else if (action === 'trigger-native-install') {
          if (deferredInstallPrompt) {
            deferredInstallPrompt.prompt();
            deferredInstallPrompt.userChoice.finally(() => {
              deferredInstallPrompt = null;
              document.getElementById('install-modal').classList.add('hidden');
            });
          }
        } else if (action === 'toggle-preshift') {
          state.preShiftOnly = !state.preShiftOnly;
          saveState();
          renderAll();
          showToast(state.preShiftOnly ? 'Pre-Shift (12h urgent) filter ON' : 'Showing all timeframe briefings');
        } else if (action === 'sync-all') {
          syncAll(true);
        } else if (action === 'toggle-drawer') {
          const d = target.dataset.drawer;
          telemetryDrawerOpen = telemetryDrawerOpen === d ? null : d;
          renderTelemetryDrawer();
        } else if (action === 'select-weather-loc') {
          state.weatherLocId = target.dataset.loc || 'angeles';
          saveState();
          renderHeaderTelemetry();
          fetchWeather().then(() => renderHeaderTelemetry());
        } else if (action === 'clear-search') {
          state.searchQuery = '';
          document.getElementById('global-search').value = '';
          renderMainView();
          renderHeaderTelemetry();
        } else if (action === 'switch-nav') {
          state.activeNav = target.dataset.nav || 'radar';
          saveState();
          renderMainView();
          window.scrollTo({ top: 0, behavior: 'smooth' });
        } else if (action === 'select-domain') {
          state.activeDomain = target.dataset.domain || 'all';
          saveState();
          renderMainView();
        } else if (action === 'reset-filters') {
          state.activeDomain = 'all';
          state.sourceTierFilter = 'all';
          state.preShiftOnly = false;
          state.searchQuery = '';
          document.getElementById('global-search').value = '';
          saveState();
          renderAll();
        } else if (action === 'toggle-save') {
          const id = target.dataset.id;
          if (!id) return;
          if (state.savedIds.includes(id)) {
            state.savedIds = state.savedIds.filter(x => x !== id);
            showToast('Removed from Saved Vault');
          } else {
            state.savedIds.unshift(id);
            showToast('Saved to offline Vault');
          }
          saveState();
          renderHeaderTelemetry();
          if (state.activeNav === 'saved') renderMainView();
        } else if (action === 'clear-saved') {
          state.savedIds = [];
          saveState();
          renderHeaderTelemetry();
          renderMainView();
          showToast('Cleared Saved Vault');
        } else if (action === 'open-deep-dive') {
          openDeepDive(target.dataset.id);
        } else if (action === 'close-modal') {
          const modalId = target.dataset.target;
          if (modalId) document.getElementById(modalId).classList.add('hidden');
        } else if (action === 'copy-url') {
          const url = target.dataset.url || '';
          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(url).then(() => showToast('Link copied to clipboard')).catch(() => showToast('Select link box & copy'));
          } else {
            showToast('Select link box & copy');
          }
        } else if (action === 'open-watchlist') {
          openWatchlistModal();
        } else if (action === 'apply-preset') {
          const pack = PRESET_PACKS.find(p => p.id === target.dataset.preset);
          if (pack) {
            const merged = new Set([...(state.watchlist || []), ...pack.keywords]);
            state.watchlist = Array.from(merged).slice(0, 35);
            saveState();
            openWatchlistModal();
            renderMainView();
            renderHeaderTelemetry();
            showToast('Added ' + pack.label + ' keywords');
          }
        } else if (action === 'add-keyword') {
          const input = document.getElementById('new-kw-input');
          const val = (input ? input.value : '').trim();
          if (!val) return;
          const set = new Set(state.watchlist || []);
          set.add(val);
          state.watchlist = Array.from(set).slice(0, 35);
          saveState();
          openWatchlistModal();
          renderMainView();
          renderHeaderTelemetry();
          showToast('Added "' + val + '"');
        } else if (action === 'remove-keyword') {
          const kw = target.dataset.kw;
          state.watchlist = (state.watchlist || []).filter(k => k !== kw);
          saveState();
          openWatchlistModal();
          renderMainView();
          renderHeaderTelemetry();
        } else if (action === 'select-offshift') {
          offshiftFilter = target.dataset.filter || 'all';
          renderMainView();
        } else if (action === 'select-mil-region') {
          militaryRegionFilter = target.dataset.region || 'ALL';
          renderMainView();
        }
      });

      document.addEventListener('change', function (e) {
        const target = e.target;
        if (!target) return;
        if (target.id === 'tier-select') {
          state.sourceTierFilter = target.value || 'all';
          saveState();
          renderMainView();
        } else if (target.id === 'mil-compare-select') {
          militaryCompareIso3 = target.value || 'CHN';
          renderMainView();
        }
      });

      document.addEventListener('input', function (e) {
        const target = e.target;
        if (!target) return;
        if (target.id === 'global-search') {
          state.searchQuery = target.value || '';
          renderHeaderTelemetry();
          renderMainView();
        } else if (target.id === 'mil-search-input') {
          militarySearchQuery = target.value || '';
          renderMainView();
        }
      });

      document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape') {
          document.getElementById('deep-dive-modal').classList.add('hidden');
          document.getElementById('watchlist-modal').classList.add('hidden');
          document.getElementById('install-modal').classList.add('hidden');
        }
      });

      renderAll();
      syncAll(false);
      setInterval(() => syncAll(false), AUTO_REFRESH_MS);
    })();
  </script>
</body>
</html>
